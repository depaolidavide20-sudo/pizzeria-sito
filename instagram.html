<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram | La Bitta Chiavari</title>
  <meta name="description" content="Profilo Instagram ufficiale de La Bitta Chiavari dal 1992." />
  <meta name="robots" content="noindex,follow" />
  <link rel="canonical" href="https://labitta.it/instagram.html" />

  <style>
    :root {
      --bg: #090807;
      --panel: #151311;
      --text: #f7f1e8;
      --muted: #d7cec1;
      --gold: #e1bf76;
      --line: rgba(225, 191, 118, 0.24);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 28px 18px;
      display: grid;
      place-items: center;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top, rgba(225, 191, 118, 0.16), transparent 34%),
        var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    .instagram-card {
      width: min(100%, 620px);
      padding: clamp(28px, 6vw, 56px);
      border: 1px solid var(--line);
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.015)), var(--panel);
      box-shadow: 0 28px 90px rgba(0, 0, 0, 0.42);
      text-align: center;
    }

    .logo {
      width: min(230px, 70vw);
      height: auto;
      margin-bottom: 28px;
      background: #fff;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--gold);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 18px;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(48px, 12vw, 76px);
      line-height: 0.96;
      font-weight: 700;
      letter-spacing: 0;
    }

    p {
      margin: 0 auto 22px;
      max-width: 520px;
      color: var(--muted);
      font-size: clamp(17px, 4vw, 20px);
    }

    .handle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 54px;
      margin: 6px 0 24px;
      padding: 12px 22px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--text);
      font-weight: 800;
      font-size: 20px;
      background: rgba(0, 0, 0, 0.22);
    }

    .actions {
      display: grid;
      gap: 12px;
      margin-top: 4px;
    }

    button,
    a {
      min-height: 56px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 22px;
      font: inherit;
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
    }

    button {
      border: 0;
      color: #17120c;
      background: linear-gradient(135deg, #e9cf8a, #d7ae63);
    }

    .secondary {
      border: 1px solid var(--line);
      color: var(--text);
      background: transparent;
    }

    .small-note {
      margin-top: 18px;
      margin-bottom: 0;
      min-height: 24px;
      color: var(--gold);
      font-size: 15px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="instagram-card">
    <img class="logo" src="logo-cover.png" alt="La Bitta Chiavari dal 1992">
    <p class="eyebrow">Instagram ufficiale</p>
    <h1>La Bitta Chiavari</h1>
    <p>
      Il profilo ufficiale &egrave; <strong>@labittachiavari</strong>. Se su mobile Instagram dovesse aprire una schermata non corretta, copia l'username e cercalo direttamente nell'app.
    </p>
    <div class="handle" id="instagramHandle">@labittachiavari</div>

    <div class="actions">
      <button type="button" onclick="copyInstagramHandle()">Copia username</button>
      <button type="button" onclick="openInstagramWeb()">Apri profilo web</button>
      <a class="secondary" href="index.html">Torna al sito</a>
    </div>
    <p class="small-note" id="copyFeedback" role="status" aria-live="polite"></p>
  </main>

  <script>
    const instagramHandle = 'labittachiavari';
    const instagramUrl = 'https://www.instagram.com/labittachiavari/?hl=it';

    function setFeedback(text) {
      document.getElementById('copyFeedback').textContent = text;
    }

    function copyInstagramHandle() {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(instagramHandle)
          .then(function () { setFeedback('Username copiato.'); })
          .catch(fallbackCopyInstagramHandle);
        return;
      }

      fallbackCopyInstagramHandle();
    }

    function fallbackCopyInstagramHandle() {
      const textArea = document.createElement('textarea');
      textArea.value = instagramHandle;
      textArea.setAttribute('readonly', '');
      textArea.style.position = 'fixed';
      textArea.style.left = '-999px';
      document.body.appendChild(textArea);
      textArea.select();

      try {
        document.execCommand('copy');
        setFeedback('Username copiato.');
      } catch (error) {
        setFeedback('Username: @' + instagramHandle);
      }

      document.body.removeChild(textArea);
    }

    function openInstagramWeb() {
      window.open(instagramUrl, '_blank', 'noopener,noreferrer');
    }
  </script>
</body>
</html>
