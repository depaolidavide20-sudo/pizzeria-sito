<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Instagram La Bitta Chiavari</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1f1712;
      --muted: #6d625a;
      --paper: #fffaf3;
      --accent: #9f2d20;
      --accent-dark: #7d2118;
      --line: rgba(31, 23, 18, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, Arial, sans-serif;
      text-align: center;
    }

    main {
      width: min(100%, 430px);
    }

    img {
      width: 112px;
      height: auto;
      margin-bottom: 26px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(28px, 7vw, 40px);
      line-height: 1;
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 700;
    }

    p {
      margin: 0 auto 22px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.55;
    }

    .actions {
      display: grid;
      gap: 12px;
      margin-top: 26px;
    }

    a {
      display: inline-flex;
      min-height: 50px;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--accent);
      border-radius: 4px;
      padding: 0 20px;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
    }

    .primary {
      background: var(--accent);
      color: #fff;
    }

    .primary:active {
      background: var(--accent-dark);
    }

    .secondary {
      background: transparent;
      color: var(--accent);
    }

    .hint {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <img src="logo.png" alt="La Bitta" />
    <h1>La Bitta su Instagram</h1>
    <p>Apri il profilo ufficiale nella versione piu stabile per il tuo telefono.</p>

    <div class="actions">
      <a class="primary" href="https://www.instagram.com/labittachiavari/?short_redirect=1#weblink" target="_blank" rel="noopener noreferrer external">Apri nel browser</a>
      <a class="secondary" href="instagram://user?id=7200669140" onclick="openInstagramApp(event)" rel="noopener noreferrer external">Apri nell'app Instagram</a>
    </div>

    <p class="hint">Se l'app mostra un errore, torna qui e usa la versione browser.</p>
  </main>

  <script>
    const instagramWebUrl = 'https://www.instagram.com/labittachiavari/?short_redirect=1#weblink';
    const instagramAppUrl = 'instagram://user?id=7200669140';
    const instagramAndroidIntentUrl = 'intent://user?id=7200669140#Intent;scheme=instagram;package=com.instagram.android;S.browser_fallback_url=' + encodeURIComponent(instagramWebUrl) + ';end';

    function openInstagramApp(event) {
      event.preventDefault();
      const startedAt = Date.now();
      const isAndroid = /Android/i.test(navigator.userAgent);

      window.location.href = isAndroid ? instagramAndroidIntentUrl : instagramAppUrl;

      window.setTimeout(function () {
        if (Date.now() - startedAt < 1600 && !document.hidden) {
          window.location.href = instagramWebUrl;
        }
      }, 900);
    }
  </script>
</body>
</html>
