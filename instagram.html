<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Instagram La Bitta Chiavari</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1f1712;
      --muted: #6d625a;
      --paper: #fffaf3;
      --accent: #9f2d20;
      --accent-dark: #7d2118;
      --line: rgba(31, 23, 18, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, Arial, sans-serif;
      text-align: center;
    }

    main {
      width: min(100%, 430px);
    }

    .logo-frame {
      width: min(100%, 272px);
      height: 148px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 28px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.54);
      padding: 24px;
    }

    .logo-frame img {
      display: block;
      width: 100%;
      height: auto;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 7vw, 40px);
      line-height: 1;
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 700;
    }

    .actions {
      display: grid;
      gap: 12px;
      margin-top: 30px;
    }

    a {
      display: inline-flex;
      min-height: 50px;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--accent);
      border-radius: 4px;
      padding: 0 20px;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
    }

    .primary {
      background: var(--accent);
      color: #fff;
    }

    .primary:active {
      background: var(--accent-dark);
    }

    .secondary {
      background: transparent;
      color: var(--accent);
    }

  </style>
</head>
<body>
  <main>
    <div class="logo-frame">
      <img src="/logo-cover.png" alt="La Bitta" />
    </div>
    <h1>La Bitta su Instagram</h1>

    <div class="actions">
      <a class="primary" href="https://www.instagram.com/labittachiavari/?short_redirect=1#weblink" target="_blank" rel="noopener noreferrer external">Apri nel browser</a>
      <a class="secondary" href="instagram://user?id=7200669140" onclick="openInstagramApp(event)" rel="noopener noreferrer external">Apri nell'app Instagram</a>
    </div>
  </main>

  <script>
    const instagramWebUrl = 'https://www.instagram.com/labittachiavari/?short_redirect=1#weblink';
    const instagramAppUrl = 'instagram://user?id=7200669140';
    const instagramAndroidIntentUrl = 'intent://user?id=7200669140#Intent;scheme=instagram;package=com.instagram.android;S.browser_fallback_url=' + encodeURIComponent(instagramWebUrl) + ';end';

    function openInstagramApp(event) {
      event.preventDefault();
      const startedAt = Date.now();
      const isAndroid = /Android/i.test(navigator.userAgent);

      window.location.href = isAndroid ? instagramAndroidIntentUrl : instagramAppUrl;

      window.setTimeout(function () {
        if (Date.now() - startedAt < 1600 && !document.hidden) {
          window.location.href = instagramWebUrl;
        }
      }, 900);
    }
  </script>
</body>
</html>
